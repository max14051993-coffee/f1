name: Update schedule

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Refresh schedule.ics
        run: node scripts/update-schedule.mjs

      - name: Detect changes
        id: diff
        run: echo "changed=$(git status --porcelain -- public/schedule.ics | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Commit updated schedule
        if: steps.diff.outputs.changed != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/schedule.ics
          git commit -m "Update race schedule from sportstimes calendars"
          git push

      - name: Build (export)
        if: steps.diff.outputs.changed != '0'
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Upload artifact
        if: steps.diff.outputs.changed != '0'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

      - name: Deploy
        id: deployment
        if: steps.diff.outputs.changed != '0'
        uses: actions/deploy-pages@v5
